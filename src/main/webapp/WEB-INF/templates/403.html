<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
            max-width: 600px;
            padding: 40px 20px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 32px;
            color: #f1f5f9;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: 2px solid transparent;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(239, 68, 68, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #f1f5f9;
            border: 2px solid #475569;
        }

        .btn-secondary:hover {
            border-color: #cbd5e1;
            background: rgba(71, 85, 105, 0.1);
        }

        /* Animated lock icon */
        .lock-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            perspective: 1000px;
        }

        .lock {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float 4s ease-in-out infinite;
        }

        .lock-body {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 90px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-radius: 8px;
            opacity: 0.15;
        }

        .lock-shackle {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 60px;
            border: 8px solid;
            border-color: #ef4444 #ef4444 transparent transparent;
            border-radius: 40px 40px 0 0;
            opacity: 0.15;
            animation: shake 2s ease-in-out infinite;
        }

        .lock-shine {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 70px;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.2), transparent);
            border-radius: 6px;
            animation: pulse 2s ease-in-out infinite;
        }

        .forbidden-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 140px;
            height: 12px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            border-radius: 6px;
            opacity: 0.4;
            animation: swing 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(-50%) rotate(0deg);
            }

            25% {
                transform: translateX(-50%) rotate(-5deg);
            }

            75% {
                transform: translateX(-50%) rotate(5deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(1.05);
            }
        }

        @keyframes swing {

            0%,
            100% {
                opacity: 0.4;
                transform: translate(-50%, -50%) rotate(45deg);
            }

            50% {
                opacity: 0.7;
                transform: translate(-50%, -50%) rotate(50deg);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .error-code {
                font-size: 80px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }

            .button-group {
                flex-direction: column;
            }

            a {
                width: 100%;
            }

            .lock-container {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <div class="lock-container">
        <div class="lock">
            <div class="lock-shackle"></div>
            <div class="lock-body"></div>
            <div class="lock-shine"></div>
            <div class="forbidden-line"></div>
        </div>
    </div>

    <div class="container">
        <div class="error-code">403</div>
        <h1>Access Forbidden</h1>
        <p>You don't have permission to access this resource. If you believe this is a mistake, please contact the
            administrator.</p>

        <div class="button-group">
            <a href="index.html" th:href="@{/index.html}">Back to Home Page</a>
            <a href="javascript:history.back()" class="btn-secondary">Go Back</a>
        </div>
    </div>
</body>

</html>
